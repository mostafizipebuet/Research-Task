   <g id="text_1">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="109.35504" y="107.987569" transform="rotate(-0 109.35504 107.987569)">1  Preserve and audit</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(109.35504 138.228576)">100 runs · 13 requirements</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(109.35504 151.380607)">JSON schema, IDs and source hashes</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="297.17784" y="107.987569" transform="rotate(-0 297.17784 107.987569)">2  Preserve each flag</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(297.17784 138.228576)">Original text + stable record ID</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(297.17784 151.348576)">Complete unflagged opportunity grid</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="485.00064" y="107.987569" transform="rotate(-0 485.00064 107.987569)">3  Propose reason labels</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(485.00064 138.228576)">Explicit multi-label codebook</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(485.00064 151.348576)">Matched text; unresolved cases kept</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="485.00064" y="248.897569" transform="rotate(-0 485.00064 248.897569)">4  Review interpretations</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(485.00064 279.514623)">Check labels, evidence and fit</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(485.00064 292.634623)">Record reviewer, note and source</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="297.17784" y="248.897569" transform="rotate(-0 297.17784 248.897569)">5  Measure patterns</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(297.17784 279.138576)">Frequency · stability · overlap</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(297.17784 292.258576)">Fixed-set uncertainty across runs</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="109.35504" y="248.897569" transform="rotate(-0 109.35504 248.897569)">6  Report with evidence</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(109.35504 279.138576)">Figures, tables and case examples</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(109.35504 292.258576)">Limitations and reproducible files</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="84.312" y="17.077969" transform="rotate(-0 84.312 17.077969)">From raw explanations to traceable research findings</text>
   </g>
  </g>
  <g id="text_14">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #485b6c" x="7.2" y="407.064094" transform="rotate(-0 7.2 407.064094)">Human interpretation is a recorded research step. Rule matches propose labels; they do not establish requirement defects.</text>
  </g>
